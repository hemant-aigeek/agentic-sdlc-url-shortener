[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc"
version = "0.1.0"
description = "Governed, stateful agentic SDLC orchestration demonstrated on a URL shortener"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hemant Gupta" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pip-licenses>=4.4",
  "jsonschema>=4.22",
  "pyyaml>=6.0",
  "types-PyYAML",
]

[project.scripts]
agentic-sdlc = "agentic_sdlc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "RUF012"]
per-file-ignores = { "tests/**" = ["S105", "S106", "S108"], "src/agentic_sdlc/orchestration/evidence.py" = ["E501"] }

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentic_sdlc"]
mypy_path = "src"
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "req(ids): requirement identifiers covered by the test",
  "unit: pure domain/engine tests",
  "contract: API contract and schema tests",
  "integration: API + persistence",
  "orchestration: engine behaviour",
  "security: security controls",
  "e2e: end-to-end scenarios",
  "architecture: structural rules",
  "slow: takes more than a few seconds",
]
filterwarnings = ["error::DeprecationWarning:agentic_sdlc.*"]

[tool.coverage.run]
source = ["agentic_sdlc"]
branch = true
