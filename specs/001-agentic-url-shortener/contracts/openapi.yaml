components:
  schemas:
    AnalyticsResponse:
      properties:
        code:
          title: Code
          type: string
        consistency:
          default: eventual
          description: Redirect events are recorded best-effort after the redirect
            (AMB-05).
          title: Consistency
          type: string
        first_redirect_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: First Redirect At
        last_redirect_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Redirect At
        redirects_by_day:
          additionalProperties:
            type: integer
          title: Redirects By Day
          type: object
        total_redirects:
          title: Total Redirects
          type: integer
      required:
      - code
      - total_redirects
      - first_redirect_at
      - last_redirect_at
      - redirects_by_day
      title: AnalyticsResponse
      type: object
      x-schema-version: 1.0.0
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LinkCreateRequest:
      properties:
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: UTC; must be in the future
          title: Expires At
        target_url:
          examples:
          - https://example.com/docs
          maxLength: 4096
          title: Target Url
          type: string
      required:
      - target_url
      title: LinkCreateRequest
      type: object
      x-schema-version: 1.0.0
    LinkResponse:
      properties:
        code:
          title: Code
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        short_url:
          title: Short Url
          type: string
        target_url:
          title: Target Url
          type: string
      required:
      - code
      - short_url
      - target_url
      - created_at
      - expires_at
      title: LinkResponse
      type: object
      x-schema-version: 1.0.0
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: 'Application plane: URL shortener API (v1). Control plane: governed,
    stateful SDLC workflow orchestration.'
  title: Agentic SDLC — URL Shortener
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/links:
    post:
      operationId: create_link_api_v1_links_post
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Idempotency-Key
      - in: header
        name: X-API-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
          description: Idempotent replay
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Link
      tags:
      - links
  /api/v1/links/{code}:
    get:
      operationId: get_link_api_v1_links__code__get
      parameters:
      - in: path
        name: code
        required: true
        schema:
          title: Code
          type: string
      - in: header
        name: X-API-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Link
      tags:
      - links
  /api/v1/links/{code}/analytics:
    get:
      operationId: get_analytics_api_v1_links__code__analytics_get
      parameters:
      - in: path
        name: code
        required: true
        schema:
          title: Code
          type: string
      - in: header
        name: X-API-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Analytics
      tags:
      - links
  /health/live:
    get:
      operationId: live_health_live_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Live Health Live Get
                type: object
          description: Successful Response
      summary: Live
      tags:
      - health
  /health/ready:
    get:
      operationId: ready_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Ready
      tags:
      - health
  /{code}:
    get:
      operationId: follow__code__get
      parameters:
      - in: path
        name: code
        required: true
        schema:
          title: Code
          type: string
      responses:
        '307':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Follow
      tags:
      - redirect
